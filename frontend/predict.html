<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Predict - VISA Insights</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">VISA Insights</a>
        <div class="collapse navbar-collapse" id="navmenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" href="predict.html">Predict</a></li>
            <li class="nav-item"><a class="nav-link" href="insights.html">Insights</a></li>
            <li class="nav-item"><a class="nav-link" href="chat.html">Chatbot</a></li>
            <li class="nav-item"><a class="nav-link" href="stats.html">Statistics</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <h2 class="mb-3">Predict</h2>
      <div class="row">
        <div class="col-lg-6">
          <form id="predict-form" class="card p-4 shadow-sm">
            <div class="mb-3">
              <label class="form-label">Prevailing wage</label>
              <input type="number" class="form-control" id="prevailing_wage" value="6500" />
            </div>
            <div class="mb-3">
              <label class="form-label">Unit of wage</label>
              <select id="unit_of_wage" class="form-select">
                <option>Monthly</option>
                <option>Yearly</option>
                <option>Weekly</option>
                <option>Hourly</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Year of Establishment</label>
              <input id="yr_of_estab" type="number" class="form-control" value="2005" />
            </div>
            <div class="mb-3">
              <label class="form-label">Number of employees</label>
              <input id="no_of_employees" type="number" class="form-control" value="150" />
            </div>
            <div class="mb-3">
              <label class="form-label">Visa type</label>
              <select id="visa_type" class="form-select">
                <option>Work</option>
                <option>Student</option>
                <option>Visitor</option>
              </select>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Estimate</button>
              <button type="button" id="clear-btn" class="btn btn-outline-secondary">Clear</button>
            </div>
          </form>
        </div>
        <div class="col-lg-6">
          <div class="card p-4 shadow-sm">
            <h5>Result</h5>
            <p class="mb-1">Estimated processing days: <strong id="est-days">—</strong></p>
            <p class="mb-1">Confidence window: <strong id="est-window">—</strong></p>
            <p class="mb-1">Acceptance: <span id="est-verdict" class="badge bg-secondary">—</span> <small id="est-score"></small></p>
          </div>
        </div>
      </div>
    </main>

    <footer class="text-center py-4 text-muted">&copy; 2026 Visa Processing Estimator</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
