<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Statistics - Visa AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">🌐</div>
          <div class="title">Visa AI</div>
        </div>
        <nav class="side-nav">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="predict.html" class="nav-link">Predict</a>
          <a href="insights.html" class="nav-link">Insights</a>
          <a href="chat.html" class="nav-link">Chatbot</a>
          <a href="stats.html" class="nav-link active">Statistics</a>
          <a href="feedback.html" class="nav-link">Feedback</a>
        </nav>
      </aside>

      <main class="main-content">
         <!-- Theme Toggle Top Right -->
        <div class="d-flex justify-content-end mb-2">
          <button id="themeToggle" class="theme-btn">🌓</button>
        </div>
        <h2>Statistics</h2>
        <div class="row mt-3">
          <div class="col-md-6">
            <div class="card p-3 feature-card"><h6>Model RMSE</h6><p id="stats-rmse">-</p></div>
          </div>
          <div class="col-md-6">
            <div class="card p-3 feature-card"><h6>Feature Count</h6><p id="stats-features">-</p></div>
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-md-6">
            <div class="card p-3 feature-card">
              <h6>Regression (processing days)</h6>
              <p>Sample RMSE: <strong id="reg-rmse">-</strong></p>
              <p>Data samples: <strong id="data-samples">-</strong></p>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card p-3 feature-card">
              <h6>Classification (acceptance)</h6>
              <p>Sample accuracy: <strong id="clf-accuracy">-</strong></p>
              <p>Sample ROC-AUC: <strong id="clf-roc">-</strong></p>
            </div>
          </div>
        </div>

        <div class="row mt-4">
          <div class="col-md-6"><div class="card p-3 feature-card"><h6>Website Visit Count</h6><canvas id="visitChart"></canvas></div></div>
          <div class="col-md-6"><div class="card p-3 feature-card"><h6>User Feedback</h6><canvas id="feedbackChart"></canvas></div></div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
  </body>
</html>
